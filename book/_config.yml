# Book settings
title: "Python for mathematics"
author: "Vincent Knight"
logo: "./img/cover/main.png"
parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist

exclude_patterns: ["*.bcp.ipynb", "**/*.bcp.ipynb", "**/README.md", "**/documentation_in_vscode/*"]

latex:
  latex_documents:
    targetname: book.tex

repository:
  url                       : https://github.com/drvinceknight/pfm
  path_to_book              : book
  branch                    : main

html:
  favicon: "./img/favicon/favicon.ico"
  google_analytics_id: UA-38016329-2
  use_repository_button: true
  use_issues_button: true
  use_edit_page_button: true
# Use utterance as a way to add comments via github issues to the book.
# https://jupyterbook.org/interactive/comments.html
  comments:
    utterances:
      repo: "drvinceknight/pfm"

bibtex_bibfiles:
    - references.bib

sphinx:
  config:
    bibtex_reference_style: author_year
